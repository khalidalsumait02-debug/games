name: Deploy to Cloudflare (cbgquiz.com)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CF_DEPLOY_DISABLED != 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the game
        run: npm ci && npm run build
        working-directory: client

      - name: Install wrangler
        run: npm ci
        working-directory: worker

      - name: Resolve (or create) the D1 database
        working-directory: worker
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="academy-db") | .uuid' || true)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Creating D1 database academy-db…"
            npx wrangler d1 create academy-db
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="academy-db") | .uuid')
          fi
          echo "Using database id: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Apply schema (idempotent)
        working-directory: worker
        run: npx wrangler d1 execute academy-db --remote --file=schema.sql -y

      - name: Deploy worker + assets + custom domains
        working-directory: worker
        run: npx wrangler deploy

      - name: Smoke-check the live API
        run: |
          sleep 10
          curl -fsS https://cbgquiz.com/api/health \
            || echo "::warning::cbgquiz.com not answering yet (DNS can take a minute) — check the workers.dev URL in the deploy step output"
